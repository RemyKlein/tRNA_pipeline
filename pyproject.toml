[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trf-pipeline"
version = "0.2.0"
description = "Transparent exact-match tRNA fragment discovery inspired by MINTmap 1.0"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
trf-pipeline = "trf_pipeline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

